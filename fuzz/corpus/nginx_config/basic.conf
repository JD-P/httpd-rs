events { worker_connections 1024; }
http {
  server {
    listen 127.0.0.1:8080 default_server;
    server_name example.test *.example.test;
    root /tmp/httpd-rs-nginx-fuzz-root;
    location = /exact { return 302 https://example.test/final; }
    location ^~ /assets/ { add_header X-Route assets always; }
    location ~ '[.]php$' { add_header X-Route php; }
  }
}
