events { worker_connections 64; }
http {
  client_max_body_size 1m;
  add_header X-Parent parent always;
  server {
    listen 127.0.0.1:18080 default_server;
    server_name policy.test;
    root /tmp/httpd-rs-nginx-fuzz-root;
    error_page 404 /404.html;
    location /assets/ {
      client_max_body_size 64k;
      add_header X-Child child always;
      expires modified 1h;
      try_files $uri $uri/ /index.html?$args;
    }
    location /aliased/ { alias /tmp/httpd-rs-nginx-alias/; }
  }
}
