events { worker_connections 64; }
http {
  upstream app {
    server 127.0.0.1:19001;
    server 127.0.0.1:19002;
  }
  server {
    listen 127.0.0.1:18080;
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-URI $request_uri;
      proxy_pass http://app/base/;
    }
  }
}
