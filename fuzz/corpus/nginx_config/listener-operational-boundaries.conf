worker_processes auto;
thread_pool default threads=4 max_queue=64;
events {
  worker_connections 64;
  use epoll;
  multi_accept off;
  accept_mutex on;
}
http {
  tcp_nodelay on;
  open_file_cache max=128 inactive=20s;
  server { server_name implicit.test; root /tmp; }
  server {
    listen 18089;
    listen [::]:18089;
    server_name dual.test;
    root /tmp;
  }
}
