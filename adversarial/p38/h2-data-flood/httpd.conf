ServerRoot "/tmp/opencode/h2lab"
Listen 127.0.0.1:38278
PidFile "/tmp/opencode/h2lab/logs/httpd-rs.pid"
ErrorLog "/tmp/opencode/h2lab/logs/error.log"
User www-data
Group www-data
ServerName localhost
TraceEnable Off
Protocols h2 http/1.1
DocumentRoot "/tmp/opencode/h2lab/www"
<Directory "/tmp/opencode/h2lab/www">
    AllowOverride None
    Require all granted
</Directory>
<VirtualHost *:38278>
    ServerName localhost
    SSLEngine On
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile "/tmp/opencode/h2lab/cert.pem"
    SSLCertificateKeyFile "/tmp/opencode/h2lab/key.pem"
    DocumentRoot "/tmp/opencode/h2lab/www"
</VirtualHost>
