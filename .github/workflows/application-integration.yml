name: real-application-integration

on:
  pull_request:
    paths:
      - "docs/examples/tutorials/**"
      - "docs/tutorials/**"
      - "tests/deployments/**"
      - "tests/docs.py"
      - ".github/workflows/application-integration.yml"
  schedule:
    - cron: "53 4 * * 1-6"
    - cron: "17 5 * * 0"
    - cron: "31 5 * * 3"
  workflow_dispatch:
    inputs:
      profile:
        description: Fixed nightly set, tutorial cases, all canonical cases, stochastic sample, or exhaustive Cartesian set
        type: choice
        options: [nightly, documentation, canonical, sample, full]
        default: sample
      scenario:
        description: Optional single scenario id
        type: string
        required: false
      sample_count:
        description: Cases selected by the stochastic sample profile
        type: number
        default: 13
      seed:
        description: Optional integer seed (blank chooses and records a random seed)
        type: string
        required: false
      benchmark:
        description: Run the short application load workloads
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-applications-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  applications:
    # One runner intentionally executes scenarios in series. This bounds both
    # Actions usage and peak Docker storage; the harness removes each pinned
    # application image before proceeding.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Git CGI prerequisites
        if: ${{ inputs.scenario == '' || inputs.scenario == 'git-cgi' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y libcgi-pm-perl perl
          # The runner image may carry a newer Git PPA build whose version is
          # intentionally incompatible with Ubuntu's matching gitweb package.
          gitweb_version=$(apt-cache show gitweb | awk '$1 == "Version:" { print $2; exit }')
          test -n "$gitweb_version"
          sudo apt-get install -y --allow-downgrades \
            "git=$gitweb_version" "git-man=$gitweb_version" "gitweb=$gitweb_version"
      - name: Install differential benchmark tools
        if: ${{ inputs.benchmark == true }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get install -y apache2 wrk
      - name: Build httpd-rs once for every scenario
        run: cargo build --locked --release -p httpd-rs
      - name: Run real-application deployments
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_SAMPLE_COUNT: ${{ inputs.sample_count }}
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_BENCHMARK: ${{ inputs.benchmark }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          profile=${INPUT_PROFILE:-nightly}
          if [ "$EVENT_NAME" = pull_request ]; then
            profile=documentation
          fi
          if [ "$EVENT_NAME" = schedule ] && [ "$EVENT_SCHEDULE" = "17 5 * * 0" ]; then
            profile=canonical
          fi
          if [ "$EVENT_NAME" = schedule ] && [ "$EVENT_SCHEDULE" = "31 5 * * 3" ]; then
            profile=documentation
          fi
          sample_count=${INPUT_SAMPLE_COUNT:-13}
          args=(
            --profile "$profile"
            --sample-count "$sample_count"
            --httpd-rs target/release/httpd-rs
            --artifacts deployment-results
            --remove-images
          )
          if [ -n "$INPUT_SCENARIO" ]; then
            args+=(--scenario "$INPUT_SCENARIO")
          fi
          if [ -n "$INPUT_SEED" ]; then
            args+=(--seed "$INPUT_SEED")
          fi
          if [ "$INPUT_BENCHMARK" = true ]; then
            args+=(--benchmark)
          fi
          python3 tests/deployments/harness.py "${args[@]}"
      - name: Show differential benchmark summary
        if: always()
        run: |
          if [ -d deployment-results ]; then
            find deployment-results -name benchmark-summary.md -type f -print \
              -exec cat {} \;
          fi
      - name: Show reclaimed container storage
        if: always()
        run: docker system df
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-application-results-${{ github.run_id }}
          path: deployment-results
          if-no-files-found: warn
          retention-days: 30
