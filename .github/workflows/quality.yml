name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  HTTPD_RS_NIGHTLY_TOOLCHAIN: nightly-2026-10-29

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Release version consistency
        run: python3 tests/release_version.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Security-focused Clippy gate
        run: >-
          cargo clippy -p httpd-rs --lib --bins --no-deps --
          -D clippy::correctness -D clippy::suspicious
          -D unused_must_use -A unsafe_code
      - name: Rust and property tests
        run: cargo test --workspace --all-targets --all-features -- --test-threads=1
      - name: Pinned native dependency boundary
        run: |
          cargo build --locked -p httpd-rs
          python3 tests/native_dependency_policy.py --binary target/debug/httpd-rs
      - name: Executable documentation
        run: python3 tests/docs.py
      - name: Generated transform and secrecy campaigns
        run: |
          python3 tests/transform_differential.py --check
          python3 tests/information_disclosure.py --check
      - name: Packaged graceful configuration reload
        env:
          HTTPD_RS_TEST_BINARY: target/debug/httpd-rs
        run: tests/httpd-rsctl_reload.sh
      - name: Unsafe boundary budget
        run: python3 tests/unsafe_inventory.py
      - name: Resource ownership inventory
        run: python3 tests/resource_inventory.py
      - name: Verification ledger and CVE matrix
        run: |
          python3 tests/verification_status.py
          python3 tests/apache_warrant.py
          python3 tests/apache_configuration_warrant.py
          python3 tests/cve_matrix.py --check
          python3 tests/cross_server_cve_matrix.py --check
      - name: Certbot Apache control command routing
        run: tests/certbot_apache_shim.sh
      - name: Privileged control-plane security invariants
        run: tests/control_plane_security.sh
      - name: Real-application deployment harness invariants
        run: python3 tests/deployments/selftest.py

  production-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install coverage and Apache reference tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
          sudo apt-get update
          sudo apt-get install -y apache2
      - name: Production coverage ratchet
        run: tests/coverage.sh

  verus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install matching Verus release
        run: tests/ci/install_verus.sh .tools/verus
      - name: Machine-check security kernels
        run: python3 tests/verification_status.py --run-verus

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchains and cargo-fuzz
        run: |
          rustup toolchain install "$HTTPD_RS_NIGHTLY_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Compile and smoke every fuzz target
        env:
          FUZZ_SMOKE_RUNS: 128
        run: tests/fuzz_smoke.sh

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install policy tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-vet --version 0.10.3 --locked
      - name: License, source, duplicate and advisory policy
        run: cargo deny check
      - name: RustSec audit
        run: cargo audit --deny warnings
      - name: Dependency review ledger
        run: |
          python3 tests/dependency_audit_policy.py
          python3 tests/dependency_unsafe.py
          cargo vet --locked
