name: nightly-adversarial

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per fuzz target
        default: "900"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PCRE2_SYS_STATIC: 1
  RUST_BACKTRACE: 1
  VAPACHE_NIGHTLY_TOOLCHAIN: nightly-2026-10-29

jobs:
  sustained-fuzzing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - http_request
          - http_connection
          - config_sections
          - config_compile
          - htaccess_walk
          - rewrite_expr
          - cgi_response
          - fastcgi_records
          - proxy_response
          - websocket_negotiation
          - h2_frames
          - h2_output
          - h2_stateful
          - cache_metadata
          - tls_policy
          - ocsp_der
          - pcre2_differential
          - pcre2_grammar
          - pcre2_resource
          - resource_transitions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore cumulative coverage corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ matrix.target }}-
      - run: |
          rustup toolchain install "$VAPACHE_NIGHTLY_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TARGETS: ${{ matrix.target }}
          FUZZ_SECONDS_PER_TARGET: ${{ inputs.fuzz_seconds || '900' }}
          FUZZ_MINIMIZE_CORPUS: 1
        run: tests/fuzz_campaign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak, thread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install "$VAPACHE_NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src
      - name: ${{ matrix.sanitizer }} sanitizer
        run: tests/sanitizers.sh ${{ matrix.sanitizer }}

  full-adversarial-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install external reference implementations
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 php-fpm curl libcurl4-openssl-dev
          rustup toolchain install "$VAPACHE_NIGHTLY_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          tests/ci/install_verus.sh .tools/verus
          PCRE2_ARCHIVE="$RUNNER_TEMP/pcre2-10.46.tar.gz"
          PCRE2_ROOT="$RUNNER_TEMP/pcre2-10.46"
          curl --fail --location --retry 3 \
            https://github.com/PCRE2Project/pcre2/archive/refs/tags/pcre2-10.46.tar.gz \
            -o "$PCRE2_ARCHIVE"
          printf '%s  %s\n' \
            ffde0c6ead457c4f8edcd8f9ce490bbabd30adabdfd179ecaddd320946cf3872 \
            "$PCRE2_ARCHIVE" | sha256sum --check -
          mkdir -p "$PCRE2_ROOT"
          tar -xzf "$PCRE2_ARCHIVE" --strip-components=1 -C "$PCRE2_ROOT"
          echo "PCRE2_TESTDATA=$PCRE2_ROOT/testdata" >> "$GITHUB_ENV"
      - name: Fail-closed pre-adversarial gate
        run: tests/pre_adversarial.sh

  protocol-and-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build --locked --release -p vapached
      - name: Install h2spec
        run: |
          curl --fail --location --retry 3 \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz \
            -o /tmp/h2spec.tar.gz
          printf '%s  %s\n' \
            157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318 \
            /tmp/h2spec.tar.gz | sha256sum --check -
          mkdir -p .tools/h2spec
          tar -xzf /tmp/h2spec.tar.gz -C .tools/h2spec
      - name: TLS policy suite
        run: python3 tests/protocol_conformance.py --tls
      - name: HTTP/2 specification suite
        run: python3 tests/protocol_conformance.py --h2spec .tools/h2spec/h2spec
      - name: Concurrent malformed-connection soak
        env:
          SOAK_SECONDS: 60
          SOAK_WORKERS: 32
        run: python3 tests/soak.py

  container-chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build release daemon
        run: cargo build --locked --release -p vapached
      - name: Inject process, syscall and resource failures
        env:
          CHAOS_SKIP_BUILD: 1
          CHAOS_SOAK_SECONDS: 30
          CHAOS_SOAK_WORKERS: 4
        run: tests/chaos.sh

  branch-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: LLVM branch coverage
        run: >-
          cargo llvm-cov --workspace --all-features --branch --lcov
          --output-path branch-coverage.lcov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-coverage
          path: branch-coverage.lcov
