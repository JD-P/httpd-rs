id = "gitea-proxy"
title = "Gitea API and smart-HTTP reverse proxy"
nightly = false
timeout_seconds = 300
disk_mb = 1536
modes = ["reverse-proxy", "streaming", "request-body", "cookies", "git-smart-http"]
upstreams = ["Gitea 1.26.0"]
images = ["gitea/gitea@sha256:af07b88edbb2173d20932f9c75ebcf4e61d7d5c2d6a7ab5cc6b97cba28aea352"]
prerequisites = ["docker", "git"]

[dimensions]
mount = ["root", "subpath"]
reload = ["none", "before-transfer"]
benchmark = ["version", "repository"]

[canonical]
mount = "subpath"
reload = "before-transfer"
benchmark = "repository"

[documentation]
mount = "subpath"
reload = "before-transfer"
benchmark = "repository"

