services:
  database:
    image: mariadb@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      MARIADB_DATABASE: bugzilla
      MARIADB_USER: bugzilla
      MARIADB_PASSWORD: vapache-bugzilla-db
      MARIADB_ROOT_PASSWORD: vapache-bugzilla-root
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /run/mysqld:rw,nosuid,nodev,size=32m
    volumes:
      - database:/var/lib/mysql
    networks:
      - application
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 90

  bugzilla:
    image: ${BUGZILLA_IMAGE:?}
    pull_policy: never
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    depends_on:
      database:
        condition: service_healthy
    environment:
      BUGZILLA_ROOT: ${BUGZILLA_ROOT:?}
      BZ_URLBASE: ${BZ_URLBASE:?}
      VAPACHE_SOCKET_GID: ${VAPACHE_SOCKET_GID:?}
      NO_PROXY: "*"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - type: bind
        source: ${BUGZILLA_ROOT:?}
        target: ${BUGZILLA_ROOT:?}
      - type: bind
        source: ${FCGI_RUN:?}
        target: /run/bugzilla
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/bugzilla/fcgi.sock"]
      interval: 2s
      timeout: 5s
      retries: 120

networks:
  application:
    internal: true

volumes:
  database:
