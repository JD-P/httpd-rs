schema = 1

[[contract]]
id = "DOC-MIGRATE-STATIC-001"
kind = "runtime"
document = "docs/tutorials/migrate-debian-static-site.md"
example = "docs/examples/migrate-debian-static-site/vhost.conf"
evidence = "httpd-rs runtime test and existing Apache differential test"
apache_test = "tests/conformance.py:Conformance.test_post_static"

[[contract.request]]
method = "GET"
path = "/"
status = 200
body = "httpd-rs documentation example\n"

[[contract.request]]
method = "GET"
path = "/missing"
status = 404
body = "The requested example page does not exist.\n"

[[contract.request]]
method = "POST"
path = "/"
status = 405
header = "Allow"

[[contract]]
id = "DOC-CAPABILITY-AUDIT-001"
kind = "capability-audit"
document = "docs/how-to/assess-apache-configuration.md"
example = "docs/examples/compatibility/capability-cgi.conf"
evidence = "httpd-rs command-line behavior"
output = "HttpdRsCapability Cgi On"

[[contract]]
id = "DOC-UNSUPPORTED-POLICY-001"
kind = "config-reject"
document = "docs/how-to/assess-apache-configuration.md"
example = "docs/examples/compatibility/unsupported-policy.conf"
evidence = "Fail-closed configuration rejection"
error = "SSLRequireSSL is not implemented; refusing to weaken TLS policy"

[[contract]]
id = "DOC-HOWTO-TLS-001"
kind = "evidence"
document = "docs/how-to/migrate-tls-and-certbot.md"
evidence = "Packaged Certbot service-selection and renewal behavior"
evidence_paths = [
    "tests/certbot_apache_integration.sh",
    "tests/certbot_apache_shim.sh",
    ".github/workflows/artifacts.yml",
]
evidence_markers = [
    "tests/certbot_apache_integration.sh::sudo certbot certonly --standalone -d example.test",
    "tests/certbot_apache_shim.sh::SHIM_TEST_HTTPD_RS_ACTIVE=1 HTTPD_RS_CERTBOT_TARGET=auto run_shim graceful",
    ".github/workflows/artifacts.yml::tests/certbot_apache_integration.sh release/httpd-rs_*.deb",
]

