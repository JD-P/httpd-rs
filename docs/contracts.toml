    "tests/httpd-rsctl_reload.sh",
    "tests/control_plane_security.sh",
    "packaging/httpd-rs.service",
    "crates/server/tests/cli_lifecycle.rs",
    "crates/server/src/config.rs",
]
evidence_markers = [
    "tests/httpd-rsctl_reload.sh::run_control graceful",
    "tests/control_plane_security.sh::deploy hook accepted a command below an untrusted ancestor",
    "packaging/httpd-rs.service::ExecReload=/usr/sbin/httpd-rsctl graceful",
    "crates/server/tests/cli_lifecycle.rs::fn foreground_reload_reopen_bind_and_actions()",
    "crates/server/src/config.rs::pub fn validate_reload_from(&self, previous: &Config)",
]

