[package]
name = "httpd-rs-verified"
authors = [ "John David Pressman <jd@jdpressman.com>" ]
description = "Verus kernels for httpd-rs"
repository = "https://github.com/JD-P/httpd-rs/"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
unsafe_code = "forbid"
