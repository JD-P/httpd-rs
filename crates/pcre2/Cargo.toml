[package]
name = "httpd-rs-pcre2"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
regex-automata = "0.4"
regex-syntax = "0.8"
smallvec = "1.15"
httpd-rs-verified = { path = "../verified", version = "0.2.2" }

[dev-dependencies]
# This is an oracle only. It is absent from httpd-rs's normal dependency
# graph and from the release binary.
pcre2-c-oracle = { package = "pcre2", version = "=0.2.11" }
# Keep the oracle on the pcre2-sys release whose bundled C source is 10.46.
# The high-level crate's generated version constants are stale (10.45), so the
# Cargo.lock checksum and this exact dependency are the reproducible pin.
pcre2-c-oracle-sys = { package = "pcre2-sys", version = "=0.2.10" }

[lints.rust]
unsafe_code = "forbid"
