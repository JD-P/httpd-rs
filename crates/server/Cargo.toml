[package]
name = "httpd-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fuzzing = ["h2/fuzzing"]
fault-injection = []

[[bin]]
name = "httpd-rs"
path = "src/main.rs"

[dependencies]
httpd-rs-os = { path = "../os", version = "0.2.2" }
httpd-rs-verified = { path = "../verified", version = "0.2.2" }
httpd-rs-pcre2 = { path = "../pcre2", version = "0.2.2" }
libc = "0.2"
rustix = { version = "1", features = ["event", "fs", "net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
h2 = "0.4"
bytes = "1"
http = "1"
sha1 = "0.11"
subtle = "2.6"
ring = "0.17"
md-5 = "0.11"
base64 = "0.22"
bcrypt = "0.19"
flate2 = "1"
# The admitted workspace profiles and allocation-meter regression are audited
# against this exact encoder implementation. Re-audit the bounds before an
# upgrade; a semver-compatible allocator-layout change is security-relevant.
brotli = "=9.1.1"
webpki-roots = "1"
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring", "std"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
loom = "0.7"
proptest = "1.9"
